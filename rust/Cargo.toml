[workspace]
resolver = "2"
members = [
  "crates/gwbot-core",
  "crates/gwbot-discord",
  "crates/gwbot-cli",
  "crates/gwbot-harness",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/itsmobsys/giveaway-bot"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "signal",
  "net",
  "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
