# Render blueprint: giveaway bot as a Web Service.
#
# The bot binds $PORT itself (/health), so the free-tier Web Service type works
# — no background worker needed. Keep it awake with a free UptimeRobot monitor
# on https://<name>.onrender.com/health every 5 minutes.

services:
  - type: web
    name: giveaway-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Singapore: closest Render region to Turso aws-ap-south-1 (Mumbai).
    # Oregon->Singapore cuts every Turso RTT from ~250ms to ~100ms warm.
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DISCORD_GIVEAWAY_CHANNEL_ID
        sync: false
      - key: TICK_SECONDS
        value: "30"
      - key: EMBED_COLOR
        value: 0x7C5CFF
