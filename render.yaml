# Render blueprint: giveaway bot as a Web Service.
#
# The bot binds $PORT itself (/health and /ready), so the free-tier Web Service
# type works - no background worker needed. Keep it awake with a free UptimeRobot
# monitor on https://<name>.onrender.com/health every 5 minutes.
#
# The image is built by the repository Dockerfile (Rust, multi-stage), so a
# deploy needs no interpreter and no build cache from a previous release.

services:
  - type: web
    name: giveaway-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Singapore: closest Render region to Turso aws-ap-south-1 (Mumbai).
    # Oregon->Singapore cuts every Turso RTT from ~250ms to ~100ms warm.
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DISCORD_GIVEAWAY_CHANNEL_ID
        sync: false
      - key: TICK_SECONDS
        value: "30"
      - key: EMBED_COLOR
        value: 0x7C5CFF
      # Short-TTL read cache (Singapore, same region as the bot). Optional at
      # runtime: with no value the bot runs exactly as before, straight to
      # Turso. Never a source of truth -- it only cuts repeat reads.
      - key: REDIS_URL
        sync: false
      # Per-process ops/sec the Redis governor will spend. The governor always
      # keeps a sliding second under the managed plan's 100 ops/s ceiling, so
      # lowering this only trades cache hits for headroom.
      - key: REDIS_OP_BUDGET_PER_SEC
        value: "80"
