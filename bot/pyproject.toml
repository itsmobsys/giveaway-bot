[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giveaway-bot"
version = "2.0.0"
description = "Simple standalone Discord giveaway bot (Turso/SQLite)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "discord.py>=2.4,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
turso = ["libsql>=0.1.11,<2"]
dev = [
  "ruff>=0.6",
]

[project.scripts]
giveaway-bot = "giveaway_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["giveaway_bot*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "RET", "SIM"]
ignore = ["S101", "B008", "SIM105", "S110"]
