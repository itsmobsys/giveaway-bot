name: tests

on:
  push:
  pull_request:

jobs:
  bot:
    name: bot tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # rusqlite's bundled SQLite (the testkit's local database) compiles a
      # small amount of C, so the runner needs a linker and pkg-config.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run test suite
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release -p gwbot-cli --locked

  dashboard:
    name: dashboard smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Check baked page bundle is fresh
        run: node build-page.js && git diff --exit-code -- api/page.js
      - name: Run dashboard smoke test
        run: node smoke.js
