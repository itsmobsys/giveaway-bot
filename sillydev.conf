; sillydev.conf
; Hosted on Silly Development: https://sillydev.co.uk
;
; Silly Development applies these settings to this server every time this
; repository is deployed: change a value, push, and the next deployment uses it.
; Comment a setting out (put ; in front of it) to leave it to the panel instead.
;
; Only the settings this server lets you change are listed. Never put a secret
; (a token or password) here: anyone who can see the repository can read it.
; Secrets belong in the Startup tab on the panel.
;
; NOTE: the bot is a single Rust binary built by the repository Dockerfile.
; This panel's images are Python interpreters, and there is no Python entry
; point left in the repository - the old app.py launcher is gone - so this
; panel cannot start the bot. Deploy the Dockerfile instead (Render, or
; `docker compose up` locally; see render.yaml), or any host that can run a
; container image or a prebuilt `giveaway-bot` binary.
;
; The Python settings below are therefore left unset on purpose. Setting PY_FILE
; to anything here will fail, because no Python file in this repository starts
; the bot.

[sillydev]
version = 1

[docker]
; No image in this list can build or run the Rust binary. Leave the panel's
; default and deploy the Dockerfile instead.
; image = "Python 3.13"

[variables]

; No Python entry point exists; the bot is started by `giveaway-bot run`.
; PY_FILE = ""

; No Python packages are needed by anything in this repository.
; PY_PACKAGES = ""

; There is no requirements file; the test suite is `cargo test --workspace`.
; REQUIREMENTS_FILE = ""
