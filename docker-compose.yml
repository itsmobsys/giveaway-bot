# Bot only. Needs TURSO_DATABASE_URL / TURSO_AUTH_TOKEN / DISCORD_BOT_TOKEN
# in .env (see .env.example). Build with `docker compose up --build`.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # The probe is a subcommand of the bot binary, so the runtime image needs no
    # curl or wget. /health is liveness only; /ready reflects the gateway.
    healthcheck:
      test: ["CMD", "giveaway-bot", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
