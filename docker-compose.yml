# Bot only. Needs TURSO_DATABASE_URL / TURSO_AUTH_TOKEN / DISCORD_BOT_TOKEN
# in .env (see .env.example).
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','10000')+'/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
