# Docker is used for the dashboard only.
#
# The Python bot is NOT containerised: it runs directly from `requirements.txt`
# and `python -m giveaway_bot run` (see render.yaml and docs/DEPLOYMENT.md).
# Only the dashboard service below is built into an image, from
# dashboard/Dockerfile.
services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_APP_URL: ${DASHBOARD_URL}
      MIGRATIONS_DIR: /app/migrations
    volumes:
      # Migrations are read-only at runtime; only the migrate command needs them.
      - ./shared/migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s