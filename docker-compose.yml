# Both services are containerised: the bot from the root Dockerfile, the dashboard
# from dashboard/Dockerfile.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_JSON: "true"
      LOG_PRETTY: "false"
      # Shared SQLite file mounted as a volume. With TURSO_DATABASE_URL set in .env
      # the hosted database is used instead and this is ignored.
      SQLITE_PATH: /app/data/giveaways.db
    volumes:
      - giveaway-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "giveaway_bot", "doctor"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Required: the dashboard checks Manage Server against Discord before every
      # admin action. Without it every admin page is refused.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      NODE_ENV: production
      PORT: "3000"
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_APP_URL: ${DASHBOARD_URL}
      SQLITE_PATH: /app/data/giveaways.db
      MIGRATIONS_DIR: /app/migrations
    volumes:
      # Shared SQLite file: same path as the bot so local dev uses one database.
      - giveaway-data:/app/data
      # Migrations are read-only at runtime; only the migrate command needs them.
      - ./shared/migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  giveaway-data:
